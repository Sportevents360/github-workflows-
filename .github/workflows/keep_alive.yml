name: Despertador de Supabase
on:
  schedule:
    - cron: '0 0 */3 * *' # Se ejecuta cada 3 días automáticamente
  workflow_dispatch: # Nos permite darle a un botón para probarlo manualmente

permissions:
  actions: write # Para volver a marcar este workflow como activo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Consulta a la API de datos; si Supabase no responde, la ejecución falla y GitHub avisa por correo
          code=$(curl -sS -o /dev/null -w "%{http_code}" "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Respuesta de Supabase: $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi

      - name: Mantener el workflow activo
        # GitHub desactiva las tareas programadas tras 60 días sin cambios en el repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep_alive.yml/enable"
